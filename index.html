<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC英語学習アプリ</title>
<style>
  :root{
    --bg:#0B0F1E; --bg2:#111832; --card:#151C33; --card2:#1B2440; --text:#EEF1FC; --sub:#8B93B8;
    --accent:#7C7CFA; --accent-light:rgba(124,124,250,.16); --accent-dark:#5B57E0;
    --accent2:#22D3EE;
    --warm:#F5A623; --warm-light:rgba(245,166,35,.16); --warm-ink:#FBBF6B;
    --ok:#34D399; --ok-bg:rgba(52,211,153,.14); --ng:#FB7185; --ng-bg:rgba(251,113,133,.14);
    --border:rgba(255,255,255,.08); --shadow:0 10px 28px rgba(0,0,0,.38);
    --glow:0 0 0 1px rgba(124,124,250,.4), 0 8px 24px rgba(124,124,250,.28);
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:
      radial-gradient(760px 380px at 15% -8%, rgba(124,124,250,.20), transparent 60%),
      radial-gradient(700px 360px at 110% 10%, rgba(34,211,238,.14), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text); min-height:100vh; line-height:1.6;}
  .wrap{max-width:640px; margin:0 auto; padding:16px 16px 48px;}
  header.app{position:relative; overflow:hidden; color:#fff;
    background:linear-gradient(150deg,#232C55 0%,#3A2E6E 55%,#1B2440 140%);
    padding:30px 16px 32px; text-align:center; border-bottom:1px solid rgba(255,255,255,.06);}
  header.app::before{content:""; position:absolute; top:-70%; right:-8%;
    width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle, rgba(124,124,250,.45), transparent 70%); filter:blur(2px);}
  header.app::after{content:""; position:absolute; left:-10%; bottom:-90%;
    width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle, rgba(34,211,238,.30), transparent 70%); filter:blur(2px);}
  header.app h1{position:relative; font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    font-size:1.4rem; font-weight:800; letter-spacing:.05em;
    background:linear-gradient(90deg,#fff,#C9CBFF); -webkit-background-clip:text; background-clip:text; color:transparent;}
  header.app p{position:relative; font-size:.8rem; color:#B9C0EA; margin-top:4px;}
  .screen{display:none;}
  .screen.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  /* ---- home ---- */
  .section-label{font-size:.75rem; font-weight:700; color:var(--sub); margin:26px 4px 10px; letter-spacing:.12em; text-transform:uppercase;}
  .level-seg{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; background:var(--card);
    border:1px solid var(--border); border-radius:var(--radius); padding:6px;}
  .level-seg button{border:none; background:transparent; padding:10px 4px; border-radius:10px;
    font-size:.85rem; font-weight:700; color:var(--sub); cursor:pointer; font-family:inherit; transition:color .15s;}
  .level-seg button.sel{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:var(--glow);}
  .modes{display:grid; gap:10px;}
  .mode-btn{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px; cursor:pointer; box-shadow:var(--shadow);
    font-family:inherit; text-align:left; width:100%; transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;}
  .mode-btn:hover{border-color:rgba(124,124,250,.45); transform:translateY(-2px); box-shadow:0 14px 30px rgba(0,0,0,.42);}
  .mode-btn:active{transform:scale(.985) translateY(0);}
  .mode-btn .icon{width:48px; height:48px; display:flex; align-items:center;
    justify-content:center; background:var(--accent-light); border-radius:12px; flex-shrink:0;}
  .mode-btn .icon svg{width:23px; height:23px; color:var(--accent);}
  .mode-btn .t{font-weight:700; font-size:1rem; color:var(--text);}
  .mode-btn .d{font-size:.78rem; color:var(--sub); margin-top:1px;}
  .mode-btn[data-mode="grammar"] .icon{background:rgba(244,114,182,.16);}
  .mode-btn[data-mode="grammar"] .icon svg{color:#F472B6;}
  .mode-btn[data-mode="idiom"] .icon{background:rgba(45,212,191,.16);}
  .mode-btn[data-mode="idiom"] .icon svg{color:#2DD4BF;}
  .mode-btn[data-mode="mix"] .icon{background:rgba(251,146,60,.16);}
  .mode-btn[data-mode="mix"] .icon svg{color:#FB923C;}
  .mode-btn.review .icon{background:var(--warm-light);}
  .mode-btn.review .icon svg{color:var(--warm-ink);}
  .mode-btn.disabled{opacity:.4; pointer-events:none;}
  .badge{margin-left:auto; background:var(--accent-light); color:var(--accent);
    font-size:.75rem; font-weight:700; padding:3px 10px; border-radius:99px; flex-shrink:0;}
  .mode-btn.review .badge{background:var(--warm-light); color:var(--warm-ink);}
  .summary{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .sum-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 8px; text-align:center; box-shadow:var(--shadow);}
  .sum-card .num{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    font-size:1.4rem; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .sum-card .lab{font-size:.72rem; color:var(--sub);}
  .link-row{display:flex; justify-content:center; gap:18px; margin-top:20px;}
  .text-link{background:none; border:none; color:var(--accent); font-size:.85rem; cursor:pointer;
    font-family:inherit; text-decoration:underline;}
  .text-link.danger{color:var(--ng);}
  .bank-note{text-align:center; font-size:.75rem; color:var(--sub); margin-top:14px;}

  /* ---- quiz ---- */
  .quiz-top{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .quiz-top .mode-chip{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:.75rem; font-weight:700;
    padding:4px 12px; border-radius:99px;}
  .quiz-top .score{font-size:.85rem; color:var(--sub); font-weight:600;}
  .quiz-top .streak{font-size:.85rem; color:var(--warm-ink); font-weight:700;}
  .quiz-top .quit{margin-left:auto; background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:6px 14px; font-size:.8rem; cursor:pointer; font-family:inherit; color:var(--sub);}
  .q-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px 18px; box-shadow:var(--shadow); margin-bottom:14px;}
  .q-genre{display:inline-block; font-size:.72rem; font-weight:700; color:var(--accent);
    background:var(--accent-light); padding:2px 10px; border-radius:99px; margin-bottom:10px;}
  .q-genre .lvtag{opacity:.7; font-weight:600;}
  .q-text{font-size:1.15rem; font-weight:700; line-height:1.55; overflow-wrap:break-word; color:var(--text);}
  .q-text .big{font-size:1.6rem; letter-spacing:.02em;}
  .choices{display:grid; gap:9px;}
  .choice{background:var(--card); border:1.5px solid var(--border); border-radius:12px;
    padding:13px 14px; font-size:.98rem; text-align:left; cursor:pointer; font-family:inherit; color:var(--text);
    display:flex; align-items:center; gap:10px; transition:border-color .12s, transform .12s;}
  .choice .key{font-size:.72rem; font-weight:700; color:var(--sub); border:1px solid var(--border);
    border-radius:6px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .choice:not(.locked):hover{border-color:var(--accent); transform:translateX(2px);}
  .choice.correct{background:var(--ok-bg); border-color:var(--ok); font-weight:700;}
  .choice.wrong{background:var(--ng-bg); border-color:var(--ng);}
  .choice.locked{cursor:default;}
  .feedback{border-radius:var(--radius); padding:14px 16px; margin-top:14px; display:none;}
  .feedback.show{display:block; animation:fade .2s ease;}
  .feedback.ok{background:var(--ok-bg); border:1px solid rgba(52,211,153,.35);}
  .feedback.ng{background:var(--ng-bg); border:1px solid rgba(251,113,133,.35);}
  .feedback .verdict{font-weight:800; font-size:1rem;}
  .feedback.ok .verdict{color:var(--ok);}
  .feedback.ng .verdict{color:var(--ng);}
  .feedback .exp{font-size:.88rem; margin-top:6px; color:var(--text);}
  .feedback .ex-sent{font-size:.85rem; color:var(--sub); margin-top:6px; font-style:italic;}
  .feedback .gloss{margin-top:12px; display:none; flex-direction:column; gap:5px;}
  .feedback .gloss.show{display:flex;}
  .feedback .gloss .gl-head{font-size:.74rem; font-weight:700; color:var(--sub); letter-spacing:.04em; margin-bottom:1px;}
  .gl-item{display:flex; align-items:baseline; gap:8px; background:var(--card); border:1px solid var(--border);
    border-radius:9px; padding:7px 10px; font-size:.85rem; color:var(--text);}
  .gl-item .gl-en{font-weight:700; flex-shrink:0;}
  .gl-item .gl-ja{color:var(--sub);}
  .gl-item .gl-mark{margin-left:auto; font-size:.72rem; font-weight:700; flex-shrink:0;}
  .gl-item.g-ok{background:var(--ok-bg); border-color:var(--ok);}
  .gl-item.g-ok .gl-en{color:var(--ok);}
  .gl-item.g-ok .gl-mark{color:var(--ok);}
  .gl-item.g-ng{background:var(--ng-bg); border-color:var(--ng);}
  .gl-item.g-ng .gl-mark{color:var(--ng);}
  .next-row{margin-top:14px; display:none;}
  .next-row.show{display:block;}
  .next-btn{width:100%; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:var(--glow); transition:transform .1s;}
  .next-btn:active{transform:scale(.98); filter:brightness(.95);}
  .kbd-hint{text-align:center; font-size:.72rem; color:var(--sub); margin-top:10px;}

  /* ---- stats ---- */
  .stats-block{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow); margin-bottom:14px;}
  .stats-block h3{font-size:.9rem; margin-bottom:10px; color:var(--text);}
  table.st{width:100%; border-collapse:collapse; font-size:.85rem;}
  table.st th,table.st td{padding:7px 6px; text-align:left; border-bottom:1px solid var(--border); color:var(--text);}
  table.st th{color:var(--sub); font-size:.75rem; font-weight:600;}
  table.st td.r,table.st th.r{text-align:right;}
  .bar{height:8px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; margin-top:3px;}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:99px;}
  .wrong-item{padding:9px 2px; border-bottom:1px solid var(--border); font-size:.88rem; color:var(--text);}
  .wrong-item:last-child{border-bottom:none;}
  .wrong-item .w{font-weight:700;}
  .wrong-item .m{color:var(--sub); font-size:.8rem;}
  .wrong-item .cnt{float:right; color:var(--ng); font-size:.78rem; font-weight:700;}
  .back-btn{width:100%; background:var(--card); color:var(--accent); border:1.5px solid var(--accent);
    border-radius:12px; padding:13px; font-size:.95rem; font-weight:700; cursor:pointer; font-family:inherit; margin-top:6px; transition:background .12s;}
  .back-btn:hover{background:var(--accent-light);}
  .empty-note{color:var(--sub); font-size:.85rem; text-align:center; padding:12px 0;}

  #toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:#1B2440; color:#fff; padding:12px 22px; border-radius:99px; font-size:.9rem;
    font-weight:600; opacity:0; pointer-events:none; transition:all .25s ease; z-index:99;
    box-shadow:0 8px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08); max-width:90vw; text-align:center;}

  /* ---- gamification: level / xp / streak ---- */
  .gamify-bar{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 16px; margin-top:18px; box-shadow:var(--shadow);}
  .level-badge{width:52px; height:52px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-weight:800; font-size:.82rem; box-shadow:var(--glow);}
  .gamify-info{flex:1; min-width:0;}
  .gm-title{font-size:.85rem; font-weight:700; color:var(--text);}
  .xp-bar{height:7px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; margin-top:6px;}
  .xp-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:99px; transition:width .3s ease;}
  .gm-xp-text{font-size:.7rem; color:var(--sub); margin-top:4px;}
  .streak-flame{font-size:.85rem; font-weight:700; color:var(--warm-ink); white-space:nowrap; flex-shrink:0; text-align:right;}

  /* ---- gamification: challenge mode toggle ---- */
  .challenge-toggle{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 16px; margin-top:12px; box-shadow:var(--shadow);}
  .ct-title{font-weight:700; font-size:.92rem; color:var(--text);}
  .ct-desc{font-size:.74rem; color:var(--sub); margin-top:1px;}
  .switch{position:relative; display:inline-block; width:46px; height:26px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .slider{position:absolute; inset:0; cursor:pointer; background:rgba(255,255,255,.15); border-radius:99px; transition:.2s;}
  .switch .slider::before{content:""; position:absolute; width:20px; height:20px; left:3px; top:3px;
    background:#fff; border-radius:50%; transition:.2s;}
  .switch input:checked+.slider{background:linear-gradient(135deg,var(--accent),var(--accent2));}
  .switch input:checked+.slider::before{transform:translateX(20px);}

  /* ---- gamification: hearts ---- */
  .hearts{display:none; gap:3px; align-items:center;}
  .heart{font-size:1.25rem; line-height:1; color:var(--ng); transition:transform .15s;}
  .heart.empty{color:rgba(255,255,255,.15);}
  .heart.brk{animation:heartBreak .45s ease;}
  @keyframes heartBreak{0%{transform:scale(1.4);} 50%{transform:scale(.7) rotate(-10deg);} 100%{transform:scale(1);}}

  /* ---- gamification: combo escalation ---- */
  .quiz-top .streak.combo-mid{color:#FBBF6B; text-shadow:0 0 8px rgba(245,166,35,.5);}
  .quiz-top .streak.combo-hot{color:#FF8A5B; text-shadow:0 0 12px rgba(255,138,91,.7); animation:comboPulse 1s ease-in-out infinite;}
  @keyframes comboPulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.15);}}

  /* ---- gamification: game over screen ---- */
  .gameover-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:36px 20px; text-align:center; box-shadow:var(--shadow); margin-top:32px;}
  .go-icon{font-size:3rem; margin-bottom:10px;}
  .go-title{font-size:1.15rem; font-weight:800; margin-bottom:18px; color:var(--text);}
  .go-stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:22px;}
  .go-stat{background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:12px 8px;}
  .go-stat .n{font-size:1.3rem; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;}
  .go-stat .l{font-size:.72rem; color:var(--sub); margin-top:2px;}
  .gameover-card .next-btn{margin-bottom:10px;}

  /* ---- gamification: achievement badges ---- */
  .badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:10px;}
  .badge-item{text-align:center; padding:10px 6px; border-radius:12px; background:var(--card2);
    border:1px solid var(--border); opacity:.35; filter:grayscale(1); transition:opacity .2s,filter .2s;}
  .badge-item.unlocked{opacity:1; filter:none; border-color:rgba(124,124,250,.4); box-shadow:0 0 0 1px rgba(124,124,250,.25);}
  .badge-item .bi-icon{font-size:1.5rem;}
  .badge-item .bi-name{font-size:.66rem; font-weight:700; margin-top:4px; color:var(--text);}
  .badge-item .bi-desc{font-size:.58rem; color:var(--sub); margin-top:2px;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  @media (max-width:400px){
    .q-text{font-size:1.05rem;}
    .summary{gap:7px;}
    .sum-card .num{font-size:1.15rem;}
  }
</style>
</head>
<body>
<header class="app">
  <h1>TOEIC 英語学習アプリ</h1>
  <p>単語・文法・熟語をランダム出題でトレーニング</p>
</header>
<div class="wrap">

  <!-- ============ ホーム ============ -->
  <div id="scr-home" class="screen active">
    <div class="gamify-bar">
      <div class="level-badge" id="gmLevel">Lv.1</div>
      <div class="gamify-info">
        <div class="gm-title" id="gmTitle">見習い学習者</div>
        <div class="xp-bar"><i id="gmXpFill" style="width:0%"></i></div>
        <div class="gm-xp-text" id="gmXpText">0 / 50 XP</div>
      </div>
      <div class="streak-flame" id="gmStreak">🔥 0日連続</div>
    </div>

    <div class="challenge-toggle">
      <label class="switch"><input type="checkbox" id="challengeToggle"><span class="slider"></span></label>
      <div>
        <div class="ct-title">⚔️ チャレンジモード</div>
        <div class="ct-desc">ハート5つ制。間違えると1つ減り、0で結果画面へ</div>
      </div>
    </div>

    <div class="section-label">レベル（TOEICスコア目安）</div>
    <div class="level-seg" id="levelSeg">
      <button data-lv="0" class="sel">すべて</button>
      <button data-lv="1">〜600</button>
      <button data-lv="2">〜730</button>
      <button data-lv="3">860+</button>
    </div>

    <div class="section-label">学習モード</div>
    <div class="modes">
      <button class="mode-btn" data-mode="vocab">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.6-1-3.6-1.3-5.5-.8v11c1.9-.5 3.9-.2 5.5.8 1.6-1 3.6-1.3 5.5-.8v-11c-1.9-.5-3.9-.2-5.5.8Z"/><path d="M12 6.5v11"/></svg></span>
        <span><span class="t">単語</span><br><span class="d">英→和・和→英の4択</span></span>
        <span class="badge" id="cnt-vocab">0問</span>
      </button>
      <button class="mode-btn" data-mode="grammar">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 4.8 19 8.6l-9.3 9.3H6v-3.7l9.2-9.4Z"/><path d="M6 19h5.5"/></svg></span>
        <span><span class="t">文法</span><br><span class="d">文章の穴埋め（Part5形式）</span></span>
        <span class="badge" id="cnt-grammar">0問</span>
      </button>
      <button class="mode-btn" data-mode="idiom">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="7" height="6" rx="3"/><rect x="13.5" y="9" width="7" height="6" rx="3"/><path d="M10.5 12h3"/></svg></span>
        <span><span class="t">熟語・コロケーション</span><br><span class="d">句動詞と前置詞の組み合わせ</span></span>
        <span class="badge" id="cnt-idiom">0問</span>
      </button>
      <button class="mode-btn" data-mode="mix">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.2h4.3c2.7 0 3.6 1.2 4.9 2.9M20.5 6.2h-3.3M20.5 6.2 18 3.7M20.5 6.2 18 8.7"/><path d="M3 17.8h4.3c2.7 0 3.6-1.2 4.9-2.9M20.5 17.8h-3.3M20.5 17.8 18 15.3M20.5 17.8 18 20.3"/></svg></span>
        <span><span class="t">ミックス</span><br><span class="d">全ジャンルからランダム出題</span></span>
        <span class="badge" id="cnt-mix">0問</span>
      </button>
      <button class="mode-btn review" data-mode="review" id="reviewBtn">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 1 1-2.3-5.2"/><path d="M19 4v4h-4"/></svg></span>
        <span><span class="t">復習</span><br><span class="d">間違えた問題だけ出題</span></span>
        <span class="badge" id="cnt-review">0問</span>
      </button>
    </div>

    <div class="section-label">学習記録</div>
    <div class="summary">

<script>
/* ==== 文法バッチ G1 ==== */
GRAMMAR.push(
{q:"The report ___ by the manager yesterday.",c:["was reviewed","reviewed","is reviewing","review"],a:0,lv:1,cat:"受動態",exp:"主語 The report は「レビューされる」側なので受動態。yesterday があるので過去形。"},
{q:"If I ___ more time, I would attend the seminar.",c:["had","have","will have","has"],a:0,lv:2,cat:"仮定法",exp:"仮定法過去。「もし〜なら…だろうに」は If + 過去形, would + 動詞の原形。"},
{q:"The new employee is ___ to learn quickly.",c:["eager","eagerly","eagerness","more eagerly"],a:0,lv:1,cat:"品詞",exp:"be動詞の後ろで主語を説明するのは形容詞。be eager to do「しきりに〜したがる」。"},
{q:"___ the heavy rain, the outdoor event was canceled.",c:["Due to","Because","Although","Despite of"],a:0,lv:2,cat:"前置詞",exp:"後ろが名詞句 the heavy rain なので前置詞句 Due to。Because は接続詞なので文が続く。"},
{q:"Neither the manager nor the staff members ___ aware of the change.",c:["were","was","is","has been"],a:0,lv:3,cat:"主述の一致",exp:"neither A nor B は B に動詞を一致させる。staff members が複数なので were。"},
{q:"The committee has not reached a decision ___.",c:["yet","already","still","ever"],a:0,lv:1,cat:"副詞",exp:"否定文の文末で「まだ〜ない」は yet。already は肯定文、still は動詞の前が基本。"}
);
</script>
<script>

GRAMMAR.push(
{q:"Ms. Tanaka ___ for this company since 2019.",c:["has worked","works","is working","worked"],a:0,lv:1,cat:"時制（現在完了）",exp:"since 2019「2019年から今まで」なので継続を表す現在完了 has worked。"},

{q:"The results were ___ to everyone in the room.",c:["surprising","surprised","surprise","surprisingly"],a:0,lv:2,cat:"分詞（感情）",exp:"「結果が人を驚かせる」ので現在分詞 surprising。人が主語なら surprised。"},

);

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function sample(arr,n,excludeFn){

}

  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}

}
/* レベルNに到達するまでの累積必要XP = 50*(1+2+...+(N-1)) */
function levelFromXp(xp){
  let lv=1, need=0;
  while(true){
    const reqForNext=need+50*lv;
    if(xp<reqForNext) break;
    need=reqForNext; lv++;
  }
  return {level:lv, cur:xp-need, next:50*lv};
}
function xpForAnswer(lv,comboAfter){
  const base=lv===3?14:lv===2?10:8;
  const comboBonus=Math.min(comboAfter,10);
  return base+comboBonus;
}
function awardXp(amount){

  saveGamify();
}
function touchDailyStreak(){
  const today=new Date().toISOString().slice(0,10);

  gamify.streakDays=(gamify.lastStudyDate===yStr)?gamify.streakDays+1:1;
  gamify.lastStudyDate=today;
  saveGamify();
}

}

];
function achievementContext(extra){
  let totalCorrect=0, totalAnswered=0;

/* ================= 出題プール構築 =================
   descriptor: {kind:"vocab"|"colloc"|"idiom"|"grammar", i:配列index} */
function buildDescriptors(mode){
  const d=[];
  const addVocab =()=>{ WORDS.forEach((w,i)=>{ if(lvOK(w.lv)) d.push({kind:"vocab",i}); }); };
  const addGram  =()=>{ GRAMMAR.forEach((g,i)=>{ if(lvOK(g.lv)) d.push({kind:"grammar",i}); }); };
  const addIdiom =()=>{
    IDIOMS.forEach((x,i)=>{ if(lvOK(x.lv)) d.push({kind:"idiom",i}); });
    WORDS.forEach((w,i)=>{ if(w.pr&&lvOK(w.lv)) d.push({kind:"colloc",i}); });
  };
  if(mode==="vocab") addVocab();
  else if(mode==="grammar") addGram();
  else if(mode==="idiom") addIdiom();
  else if(mode==="mix"){ addVocab(); addGram(); addIdiom(); }
  else if(mode==="review"){
    reviewQids().forEach(qid=>{
      const dd=qidToDescriptor(qid);
      if(dd) d.push(dd);
    });
  }
  return d;
}
function reviewQids(){
  /* 出題データに存在する（解決できる）ものだけを復習対象にする */
  if(!wordIndex) buildIndexes();
  return Object.keys(stats).filter(k=>stats[k].last==="w"&&qidToDescriptor(k));
}
/* qid: v:{word|品詞} / p:{word|品詞} / i:{idiom} / g:{index} */
let wordIndex=null, idiomIndex=null;
function wkey(w){ return w.w+"|"+w.p; }
function buildIndexes(){
  wordIndex={}; WORDS.forEach((w,i)=>wordIndex[wkey(w)]=i);
  idiomIndex={}; IDIOMS.forEach((x,i)=>idiomIndex[x.w]=i);
}
function qidToDescriptor(qid){
  const t=qid[0], key=qid.slice(2);
  if(t==="v"&&wordIndex[key]!==undefined) return {kind:"vocab",i:wordIndex[key]};
  if(t==="p"&&wordIndex[key]!==undefined&&WORDS[wordIndex[key]].pr) return {kind:"colloc",i:wordIndex[key]};
  if(t==="i"&&idiomIndex[key]!==undefined) return {kind:"idiom",i:idiomIndex[key]};
  if(t==="g"){ const i=parseInt(key,10); if(GRAMMAR[i]) return {kind:"grammar",i}; }
  return null;
}
function descriptorQid(d){
  if(d.kind==="vocab") return "v:"+wkey(WORDS[d.i]);
  if(d.kind==="colloc") return "p:"+wkey(WORDS[d.i]);
  if(d.kind==="idiom") return "i:"+IDIOMS[d.i].w;
  return "g:"+d.i;
}

/* ================= 問題生成 ================= */
function makeQuestion(d){
  if(d.kind==="grammar"){
    const g=GRAMMAR[d.i];
    const order=shuffle([0,1,2,3]);
    return {qid:"g:"+d.i, genre:"文法・"+g.cat, lv:g.lv,
      text:esc(g.q), choices:order.map(k=>esc(g.c[k])), answer:order.indexOf(g.a),
      exp:g.exp, ex:null};
  }
  if(d.kind==="colloc"){
    const w=WORDS[d.i];
    const wrong=sample(PREP_SET,3,p=>p!==w.pr);
    const choices=shuffle([w.pr,...wrong]);
    return {qid:"p:"+wkey(w), genre:"コロケーション", lv:w.lv,
      text:'<span class="big">'+esc(w.w)+' ___</span><br><span style="font-size:.9rem;color:var(--sub)">「'+esc(w.m)+'」— 空欄に入る前置詞は？</span>',
      choices:choices.map(esc), answer:choices.indexOf(w.pr),
      exp:esc(w.w)+" "+esc(w.pr)+" で「"+esc(w.m)+"」。", ex:w.ex};
  }
  if(d.kind==="idiom"){
    const x=IDIOMS[d.i];
    const ej=Math.random()<0.5;
    if(ej){
      const opts=[{t:x.m,en:x.w,ja:x.m}].concat(
        sample(IDIOMS,3,y=>y.m!==x.m).map(y=>({t:y.m,en:y.w,ja:y.m})));
      shuffle(opts);
      return {qid:"i:"+x.w, genre:"熟語", lv:x.lv,
        text:'<span class="big">'+esc(x.w)+'</span><br><span style="font-size:.9rem;color:var(--sub)">この熟語の意味は？</span>',
        choices:opts.map(o=>esc(o.t)), answer:opts.findIndex(o=>o.t===x.m),
        gloss:opts.map(o=>({en:o.en,ja:o.ja})),
        exp:esc(x.w)+"＝「"+esc(x.m)+"」", ex:x.ex};
    }else{
      const opts=[{t:x.w,en:x.w,ja:x.m}].concat(
        sample(IDIOMS,3,y=>y.w!==x.w).map(y=>({t:y.w,en:y.w,ja:y.m})));
      shuffle(opts);
      return {qid:"i:"+x.w, genre:"熟語", lv:x.lv,
        text:'「'+esc(x.m)+'」<br><span style="font-size:.9rem;color:var(--sub)">を意味する熟語は？</span>',
        choices:opts.map(o=>esc(o.t)), answer:opts.findIndex(o=>o.t===x.w),
        gloss:opts.map(o=>({en:o.en,ja:o.ja})),
        exp:esc(x.w)+"＝「"+esc(x.m)+"」", ex:x.ex};
    }
  }
  /* vocab */
  const w=WORDS[d.i];
  const ej=Math.random()<0.5;
  const near=y=>y.p===w.p&&y.w!==w.w&&y.m!==w.m;
  let cands=WORDS.filter(near);
  if(cands.length<3) cands=WORDS.filter(y=>y.w!==w.w&&y.m!==w.m);
  const wrong=sample(cands,3);
  if(ej){
    const opts=[{t:w.m,en:w.w,ja:w.m}].concat(
      wrong.map(y=>({t:y.m,en:y.w,ja:y.m})));
    shuffle(opts);
    return {qid:"v:"+wkey(w), genre:"単語（英→和）", lv:w.lv,
      text:'<span class="big">'+esc(w.w)+'</span><br><span style="font-size:.9rem;color:var(--sub)">['+esc(w.p)+'] この単語の意味は？</span>',
      choices:opts.map(o=>esc(o.t)), answer:opts.findIndex(o=>o.t===w.m),
      gloss:opts.map(o=>({en:o.en,ja:o.ja})),
      exp:esc(w.w)+"＝「"+esc(w.m)+"」", ex:w.ex};
  }else{
    const opts=[{t:w.w,en:w.w,ja:w.m}].concat(
      wrong.map(y=>({t:y.w,en:y.w,ja:y.m})));
    shuffle(opts);
    return {qid:"v:"+wkey(w), genre:"単語（和→英）", lv:w.lv,
      text:'「'+esc(w.m)+'」<br><span style="font-size:.9rem;color:var(--sub)">['+esc(w.p)+'] を意味する単語は？</span>',
      choices:opts.map(o=>esc(o.t)), answer:opts.findIndex(o=>o.t===w.w),
      gloss:opts.map(o=>({en:o.en,ja:o.ja})),
      exp:esc(w.w)+"＝「"+esc(w.m)+"」", ex:w.ex};
  }
}

/* ================= 画面遷移 ================= */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}
function goHome(){
  if(inChallenge&&noMissSoFar&&sessionTotal>=15){
    checkAchievements({noMissClear:true});
  }
  inChallenge=false; curMode=null; renderHome(); show("scr-home");
}
function showStats(){ renderStats(); show("scr-stats"); }

/* ================= ホーム ================= */
function renderHome(){
  buildIndexes();
  const cVocab=WORDS.filter(w=>lvOK(w.lv)).length;
  const cGram=GRAMMAR.filter(g=>lvOK(g.lv)).length;
  const cIdiom=IDIOMS.filter(x=>lvOK(x.lv)).length+WORDS.filter(w=>w.pr&&lvOK(w.lv)).length;
  const cReview=reviewQids().length;
  document.getElementById("cnt-vocab").textContent=cVocab+"問";
  document.getElementById("cnt-grammar").textContent=cGram+"問";
  document.getElementById("cnt-idiom").textContent=cIdiom+"問";
  document.getElementById("cnt-mix").textContent=(cVocab+cGram+cIdiom)+"問";
  document.getElementById("cnt-review").textContent=cReview+"問";
  document.getElementById("reviewBtn").classList.toggle("disabled",cReview===0);

  let total=0,ok=0;
  Object.values(stats).forEach(s=>{total+=s.c+s.w; ok+=s.c;});
  document.getElementById("sumTotal").textContent=total;
  document.getElementById("sumAcc").textContent=total?Math.round(ok/total*100)+"%":"-";
  document.getElementById("sumReview").textContent=cReview;
  document.getElementById("bankNote").textContent=
    "収録数: 単語 "+WORDS.length+"語 / 文法 "+GRAMMAR.length+"問 / 熟語 "+IDIOMS.length
    +" / コロケーション "+WORDS.filter(w=>w.pr).length;

  renderGamifyBar();
  document.getElementById("challengeToggle").checked=gamify.challengeMode;
}

/* ================= クイズ ================= */
function startMode(mode){
  buildIndexes();
  const d=buildDescriptors(mode);
  if(d.length===0){
    toast(mode==="review"?"復習する問題はありません":"このレベルの問題がありません");
    return;
  }
  curMode=mode;
  pool=shuffle(d); poolIdx=0;
  sessionOK=0; sessionTotal=0; streak=0;
  inChallenge=gamify.challengeMode;
  hearts=MAX_HEARTS; sessionMaxCombo=0; noMissSoFar=true; pendingGameOver=false;
  document.getElementById("quizModeChip").textContent=
    MODE_LABEL[mode]+(curLevel?"・"+LV_LABEL[curLevel]:"");
  document.getElementById("nextBtn").textContent="次の問題へ";
  renderHearts();
  show("scr-quiz");
  nextQuestion();
}
function retryChallenge(){
  if(curMode) startMode(curMode);
  else goHome();
}
function showGameOver(){
  const acc=sessionTotal?Math.round(sessionOK/sessionTotal*100):0;
  document.getElementById("goStats").innerHTML=
    "<div class='go-stat'><div class='n'>"+sessionOK+"/"+sessionTotal+"</div><div class='l'>正解数</div></div>"
    +"<div class='go-stat'><div class='n'>"+acc+"%</div><div class='l'>正答率</div></div>"
    +"<div class='go-stat'><div class='n'>"+sessionMaxCombo+"</div><div class='l'>最大コンボ</div></div>"
    +"<div class='go-stat'><div class='n'>Lv."+levelFromXp(gamify.xp).level+"</div><div class='l'>現在のレベル</div></div>";
  show("scr-gameover");
}
function nextQuestion(){
  if(pendingGameOver){ pendingGameOver=false; showGameOver(); return; }
  if(curMode==="review"){
    /* 復習は毎回プールを再計算（正解した問題を除外していく） */
    const d=buildDescriptors("review");
    if(d.length===0){
      toast("復習プールをすべてクリアしました！🎉");
      goHome(); return;
    }
    pool=shuffle(d); poolIdx=0;
  }else if(poolIdx>=pool.length){
    pool=shuffle(pool); poolIdx=0;
  }
  curQ=makeQuestion(pool[poolIdx++]);
  answered=false;
  document.getElementById("qGenre").innerHTML=esc(curQ.genre)
    +' <span class="lvtag">Lv.'+LV_LABEL[curQ.lv]+'</span>';
  document.getElementById("qText").innerHTML=curQ.text;
  const box=document.getElementById("choices");
  box.innerHTML="";
  curQ.choices.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.innerHTML='<span class="key">'+(i+1)+'</span><span>'+c+'</span>';
    b.onclick=()=>answer(i);
    box.appendChild(b);
  });
  document.getElementById("feedback").className="feedback";
  document.getElementById("nextRow").className="next-row";
  updateQuizTop();
}
function answer(i){
  if(answered) return;
  answered=true;
  const ok=i===curQ.answer;
  const btns=document.querySelectorAll(".choice");
  btns.forEach((b,k)=>{
    b.classList.add("locked");
    if(k===curQ.answer) b.classList.add("correct");
    else if(k===i&&!ok) b.classList.add("wrong");
  });
  sessionTotal++;
  if(ok){
    sessionOK++; streak++;
    sessionMaxCombo=Math.max(sessionMaxCombo,streak);
    if(streak>gamify.bestCombo) gamify.bestCombo=streak;
    awardXp(xpForAnswer(curQ.lv,streak));
  }else{
    streak=0;
    if(inChallenge){
      hearts=Math.max(0,hearts-1);
      noMissSoFar=false;
      if(hearts===0) pendingGameOver=true;
    }
  }
  const s=stats[curQ.qid]||{c:0,w:0,last:null};
  if(ok){s.c++; s.last="c";}else{s.w++; s.last="w";}
  stats[curQ.qid]=s; saveStats();
  touchDailyStreak();
  checkAchievements();
  renderHearts(!ok&&inChallenge);
  if(pendingGameOver) document.getElementById("nextBtn").textContent="結果を見る";

  const fb=document.getElementById("feedback");
  fb.className="feedback show "+(ok?"ok":"ng");
  document.getElementById("fbVerdict").textContent=ok?"⭕ 正解！":"❌ 不正解";
  document.getElementById("fbExp").textContent=curQ.exp||"";
  document.getElementById("fbEx").textContent=curQ.ex?("例文: "+curQ.ex):"";

  const gl=document.getElementById("fbGloss");
  if(curQ.gloss){
    gl.innerHTML="<div class='gl-head'>選択肢の意味</div>"+curQ.gloss.map((g,k)=>{
      let cls="gl-item", mark="";
      if(k===curQ.answer){cls+=" g-ok"; mark="正解";}
      else if(k===i){cls+=" g-ng"; mark="あなたの回答";}
      return "<div class='"+cls+"'><span class='gl-en'>"+esc(g.en)+"</span>"
        +"<span class='gl-ja'>"+esc(g.ja)+"</span>"
        +(mark?"<span class='gl-mark'>"+mark+"</span>":"")+"</div>";
    }).join("");
    gl.className="gloss show";
  }else{
    gl.className="gloss";
  }
  document.getElementById("nextRow").className="next-row show";
  document.getElementById("nextBtn").focus();
  updateQuizTop();
}
function updateQuizTop(){
  document.getElementById("quizScore").textContent=sessionOK+"/"+sessionTotal
    +(sessionTotal?"（"+Math.round(sessionOK/sessionTotal*100)+"%）":"");
  const streakEl=document.getElementById("quizStreak");
  streakEl.textContent=streak>=2?"🔥"+streak+"連続":"";
  streakEl.classList.remove("combo-mid","combo-hot");
  if(streak>=10) streakEl.classList.add("combo-hot");
  else if(streak>=5) streakEl.classList.add("combo-mid");
}

/* ================= 統計 ================= */
function genreOfQid(qid){
  if(qid[0]==="v") return "単語";
  if(qid[0]==="p") return "コロケーション";
  if(qid[0]==="i") return "熟語";
  return "文法";
}
function lvOfQid(qid){
  const d=qidToDescriptor(qid);
  if(!d) return null;
  if(d.kind==="grammar") return GRAMMAR[d.i].lv;
  if(d.kind==="idiom") return IDIOMS[d.i].lv;
  return WORDS[d.i].lv;
}
function labelOfQid(qid){
  const d=qidToDescriptor(qid);
  if(!d) return {w:qid,m:""};
  if(d.kind==="grammar"){const g=GRAMMAR[d.i]; return {w:g.q,m:g.cat+"／正解: "+g.c[g.a]};}
  if(d.kind==="idiom"){const x=IDIOMS[d.i]; return {w:x.w,m:x.m};}
  const w=WORDS[d.i];
  return {w:(d.kind==="colloc"?w.w+" "+w.pr:w.w),m:w.m};
}
function renderStats(){
  buildIndexes();
  const byGenre={}, byLevel={};
  Object.entries(stats).forEach(([qid,s])=>{
    const g=genreOfQid(qid);
    byGenre[g]=byGenre[g]||{c:0,w:0}; byGenre[g].c+=s.c; byGenre[g].w+=s.w;
    const lv=lvOfQid(qid);
    if(lv){byLevel[lv]=byLevel[lv]||{c:0,w:0}; byLevel[lv].c+=s.c; byLevel[lv].w+=s.w;}
  });
  const row=(name,s)=>{
    const t=s.c+s.w, pct=t?Math.round(s.c/t*100):0;
    return "<tr><td>"+esc(name)+"</td><td class='r'>"+t+"回</td><td class='r'>"+pct
      +"%<div class='bar'><i style='width:"+pct+"%'></i></div></td></tr>";
  };
  const head="<tr><th>ジャンル</th><th class='r'>回答数</th><th class='r'>正答率</th></tr>";
  let g="";
  ["単語","文法","熟語","コロケーション"].forEach(k=>{ if(byGenre[k]) g+=row(k,byGenre[k]); });
  document.getElementById("stGenre").innerHTML=g?head+g:"";
  if(!g) document.getElementById("stGenre").innerHTML="<tr><td class='empty-note'>まだ記録がありません</td></tr>";
  let l="";
  [1,2,3].forEach(k=>{ if(byLevel[k]) l+=row(LV_LABEL[k]+"レベル",byLevel[k]); });
  document.getElementById("stLevel").innerHTML=l?head.replace("ジャンル","レベル")+l
    :"<tr><td class='empty-note'>まだ記録がありません</td></tr>";

  const wrongs=Object.entries(stats).filter(([,s])=>s.w>0)
    .sort((a,b)=>b[1].w-a[1].w).slice(0,20);
  const box=document.getElementById("stWrong");
  if(wrongs.length===0){ box.innerHTML="<div class='empty-note'>間違えた問題はありません</div>"; }
  else{
    box.innerHTML=wrongs.map(([qid,s])=>{
      const lab=labelOfQid(qid);
      return "<div class='wrong-item'><span class='cnt'>×"+s.w+"</span><span class='w'>"
        +esc(lab.w)+"</span><br><span class='m'>"+esc(lab.m)+"</span></div>";
    }).join("");
  }

  const bg=document.getElementById("badgeGrid");
  bg.innerHTML=ACHIEVEMENTS.map(a=>{
    const on=gamify.badges.includes(a.id);
    return "<div class='badge-item"+(on?" unlocked":"")+"'><div class='bi-icon'>"+a.icon+"</div>"
      +"<div class='bi-name'>"+esc(a.name)+"</div><div class='bi-desc'>"+esc(a.desc)+"</div></div>";
  }).join("");
}
function resetStats(){
  if(confirm("学習記録（正答率・復習リスト）をすべて削除します。よろしいですか？")){
    stats={}; saveStats(); renderHome();
  }
}

/* ================= イベント ================= */
document.getElementById("levelSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#levelSeg button").forEach(x=>x.classList.remove("sel"));
  b.classList.add("sel");
  curLevel=parseInt(b.dataset.lv,10);
  renderHome();
});
document.querySelectorAll(".mode-btn").forEach(b=>{
  b.addEventListener("click",()=>startMode(b.dataset.mode));
});
document.getElementById("challengeToggle").addEventListener("change",e=>{
  gamify.challengeMode=e.target.checked;
  saveGamify();
});
document.addEventListener("keydown",e=>{
  if(!document.getElementById("scr-quiz").classList.contains("active")) return;
  if(e.key>="1"&&e.key<="4"&&!answered){
    const i=parseInt(e.key,10)-1;
    if(i<curQ.choices.length) answer(i);
  }else if(e.key==="Enter"&&answered){
    e.preventDefault(); nextQuestion();
  }
});

renderHome();
</script>
